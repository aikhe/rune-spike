name: windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: anomalyco/rune
          # dev as of 2026-11-07; dev is never rewritten
          ref: f73f72cdc563534e4f7de9f5a79bed007ac42384
          path: rune

      # rust-toolchain.toml pins the toolchain; this installs it before caching
      - run: rustup show
        working-directory: rune

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rune

      - run: cargo build --release -p hello -p overlay
        working-directory: rune

      - run: cargo build --release -p overlay-lab --bin overlay-lab
        working-directory: rune

      - uses: actions/upload-artifact@v4
        with:
          name: rune-windows
          path: |
            rune/target/release/hello.exe
            rune/target/release/overlay.exe
            rune/target/release/overlay-lab.exe
