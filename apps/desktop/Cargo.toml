[package]
name = "octo-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "octo"
path = "src/main.rs"

[dependencies]
# pre-release: pin a rev of rune's `dev`, which is never rewritten
rune = { git = "https://github.com/anomalyco/rune", rev = "f73f72cdc563534e4f7de9f5a79bed007ac42384" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
