[package]
name = "octo-desktop"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "octo"
path = "src/main.rs"

[dependencies]
# pre-release, on a fork: aikhe/rune's `octo` branch is a rev of rune's `dev` plus a fix for
# windows 10 drawing its own title bar over ours; rebase it onto a newer `dev` to update
rune = { git = "https://github.com/aikhe/rune", rev = "5dc4502d65589060387c9aa84247254bfa707c51" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
